    <script>
        // ==========================================
        // ⚙️ TESTING SWITCH CONFIGURATION
        // ==========================================
        // Set to true to turn OFF validation (accepts any text for testing)
        // Set to false to turn ON validation (strict checking for real users)
        const bypassValidation = true; 

        function clearError() {
            document.getElementById('txid-error').style.display = 'none';
        }

        function validateAndSendEmail(e) {
            e.preventDefault();
            
            const network = document.getElementById('network').value;
            const txid = document.getElementById('txid').value.trim();
            const errorElement = document.getElementById('txid-error');
            
            const trc20Regex = /^[a-fA-F0-9]{64}$/; 
            const bep20Regex = /^0x[a-fA-F0-9]{64}$/;

            let isValid = false;

            // Check if validation is bypassed for testing
            if (bypassValidation) {
                isValid = true; 
            } else {
                // Run strict crypto checks if validation is turned ON
                if (network === "TRC20") {
                    if (trc20Regex.test(txid)) {
                        isValid = true;
                    } else {
                        errorElement.innerText = "⚠️ Invalid TRC20 TxID. Must be exactly 64 characters.";
                        errorElement.style.display = "block";
                    }
                } else if (network === "BEP20") {
                    if (bep20Regex.test(txid)) {
                        isValid = true;
                    } else {
                        errorElement.innerText = "⚠️ Invalid BEP20 TxID. Must start with '0x' followed by 64 characters.";
                        errorElement.style.display = "block";
                    }
                }
            }

            if (isValid) {
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const platform = document.getElementById('platform').value;
                const username = document.getElementById('username').value || "None";
                
                // Add a notice if you are currently running a test
                const testStatus = bypassValidation ? "%0D%0A[TEST MODE ACTIVE - NO HASH VALIDATION RUN]" : "";
                
                const body = `QUANTUM SMC REGISTRATION DATA${testStatus}%0D%0A-------------------------%0D%0AName: ${name}%0DEmail: ${email}%0DPlatform: ${platform}%0DNetwork: USDT-${network}%0DUser: ${username}%0DTxID: ${txid}%0D%0A-------------------------%0D%0A[Please attach your payment screenshot directly to this email before sending]`;
                
                window.location.href = `mailto:realtimecooder@://gmail.com Registration - ${encodeURIComponent(name)}&body=${body}`;
            }
        }
    </script>
